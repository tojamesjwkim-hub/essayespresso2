<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assign worksheets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="runnerTop" class="runner"></div>
<div class="wrap">
  <p style="margin-top:14px;">
    <a href="dashboard.html">← Dashboard</a> ·
    <a href="answers.html">Answers &amp; marking</a>
  </p>
  <h1>Assign worksheets</h1>
  <div id="err" class="err hidden"></div>
  <p class="muted">Pick a student, add whole worksheets, set the order they see with ▲▼.</p>
  <select id="studentSel" style="width:100%;max-width:420px;margin-bottom:14px;"></select>
  <div id="area"><p class="muted">Pick a student above.</p></div>
</div>
<div id="runnerBottom" class="runner" style="margin-top:24px;"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="shared-ui.js"></script>
<script>
var students=[], worksheets=[];

auth.onAuthStateChanged(function(user){
  if(!user){ location.href="index.html"; return; }
  if(!isTeacher(user)){ location.href="student.html"; return; }
  loadSite();
  teacherRef.get().then(function(s){ if(s.exists) applyBackground(s.data().bg,s.data().opacity); });

  Promise.all([
    studentsCol.where("status","==","approved").get(),
    wsCol.orderBy("order","asc").get()
  ]).then(function(res){
    res[0].forEach(function(d){ students.push(Object.assign({uid:d.id},d.data())); });
    res[1].forEach(function(d){ worksheets.push(Object.assign({id:d.id},d.data())); });
    var sel=$("studentSel");
    sel.innerHTML='<option value="">— pick a student —</option>';
    students.forEach(function(s){
      sel.innerHTML+='<option value="'+s.uid+'">'+esc(s.name||s.email)+' ('+esc(s.email)+')</option>';
    });
    var pre=new URLSearchParams(location.search).get("student");
    if(pre){ sel.value=pre; render(pre); }
    sel.onchange=function(){ sel.value?render(sel.value):($("area").innerHTML='<p class="muted">Pick a student above.</p>'); };
  }).catch(handleErr("Could not load"));
});

function render(uid){
  var area=$("area"); area.innerHTML='<p class="spinner">Loading…</p>';
  studentsCol.doc(uid).collection("assignments").get().then(function(snap){
    var assigned=[]; snap.forEach(function(d){ assigned.push(Object.assign({wsId:d.id},d.data())); });
    assigned.sort(function(a,b){ return (a.order||0)-(b.order||0); });
    area.innerHTML="";
    var box=el("div","card fill");

    if(!assigned.length) box.appendChild(el("p","muted","No worksheets assigned yet."));
    assigned.forEach(function(a,i){
      var w=worksheets.filter(function(x){return x.id===a.wsId;})[0];
      var r=el("div","row");
      var left=el("div","left");
      left.innerHTML='<strong>'+(i+1)+'. '+esc(w?w.title:"(deleted worksheet)")+'</strong> '+
        (a.done?'<span class="pill">DONE ✓ '+esc(fmtTime(a.doneAt))+'</span>':'<span class="muted">not done</span>');
      r.appendChild(left);
      r.appendChild(mkBtn("▲","arrow",function(){ swap(uid,assigned,i,-1); }));
      r.appendChild(mkBtn("▼","arrow",function(){ swap(uid,assigned,i,1); }));
      if(a.done) r.appendChild(mkBtn("Reset done","",function(){
        studentsCol.doc(uid).collection("assignments").doc(a.wsId)
          .set({done:false,doneAt:null},{merge:true}).then(function(){ render(uid); })
          .catch(handleErr("Could not reset"));
      }));
      r.appendChild(mkBtn("Unassign","",function(){
        studentsCol.doc(uid).collection("assignments").doc(a.wsId).delete()
          .then(function(){ render(uid); }).catch(handleErr("Could not unassign"));
      }));
      box.appendChild(r);
    });

    var free=worksheets.filter(function(w){
      return !assigned.some(function(a){return a.wsId===w.id;});
    });
    var add=el("div"); add.style.cssText="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;";
    var sel=document.createElement("select"); sel.style.flex="1";
    sel.innerHTML='<option value="">+ Add a worksheet…</option>'+
      free.map(function(w){return '<option value="'+w.id+'">'+esc(w.title)+'</option>';}).join("");
    add.appendChild(sel);
    add.appendChild(mkBtn("Add","primary",function(){
      if(!sel.value) return;
      studentsCol.doc(uid).collection("assignments").doc(sel.value)
        .set({order:assigned.length,done:false,doneAt:null})
        .then(function(){ render(uid); }).catch(handleErr("Could not assign"));
    }));
    box.appendChild(add);
    area.appendChild(box);
  }).catch(handleErr("Could not load assignments"));
}

function swap(uid,list,i,dir){
  var j=i+dir; if(j<0||j>=list.length) return;
  var a=list[i],b=list[j];
  var batch=db.batch();
  batch.set(studentsCol.doc(uid).collection("assignments").doc(a.wsId),{order:j},{merge:true});
  batch.set(studentsCol.doc(uid).collection("assignments").doc(b.wsId),{order:i},{merge:true});
  batch.commit().then(function(){ render(uid); }).catch(handleErr("Could not reorder"));
}
</script>
</body>
</html>
