<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generate worksheet</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body class="teacher">
<div id="runnerTop" class="runner"></div>
<div class="wrap" style="max-width:820px;">
  <p style="margin-top:14px;"><a href="dashboard.html">← Dashboard</a></p>
  <h1>Generate a worksheet from student answers</h1>
  <div id="err" class="err hidden"></div>

  <div class="card">
    <div class="filterbar">
      <span class="muted">Source worksheet:</span>
      <select id="srcWs" style="min-width:200px;"></select>
      <span class="muted">Student:</span>
      <select id="srcStudent" style="min-width:180px;"><option value="">All students</option></select>
    </div>
    <p class="muted">Build each new multiple-choice question from the student's answers:</p>
    <p style="margin:5px 0;">Question text ← <select id="mapQ" style="width:auto;"></select></p>
    <p style="margin:5px 0;">Option A ← <select id="mapA" style="width:auto;"></select>
      <label class="muted"><input type="checkbox" id="aCorrect" checked style="width:auto;"> mark correct</label></p>
    <p style="margin:5px 0;">Option B ← <select id="mapB" style="width:auto;"></select></p>
    <p class="muted" style="margin-top:6px;">
      <label><input type="checkbox" id="everyAttempt" checked style="width:auto;"> Use every attempt — each becomes one new question</label></p>
    <p style="margin-top:10px;"><strong>New worksheet name:</strong>
      <input id="newName" type="text" style="max-width:300px;"></p>
    <button class="act" id="previewBtn">Preview →</button>
  </div>

  <div id="previewArea"></div>
</div>
<div id="runnerBottom" class="runner" style="margin-top:24px;"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=3"></script>
<script src="shared-ui.js?v=3"></script>
<script>
var worksheets=[], students=[], built=[];

auth.onAuthStateChanged(function(user){
  if(!user){ location.href="index.html"; return; }
  if(!isTeacher(user)){ location.href="student.html"; return; }
  loadSite();
  teacherRef.get().then(function(s){ if(s.exists) applyBackground(s.data().bg,s.data().opacity); });

  Promise.all([
    wsCol.orderBy("order","asc").get(),
    studentsCol.where("status","==","approved").get()
  ]).then(function(r){
    r[0].forEach(function(d){ worksheets.push(Object.assign({id:d.id},d.data())); });
    r[1].forEach(function(d){ students.push(Object.assign({uid:d.id},d.data())); });
    worksheets.forEach(function(w){
      $("srcWs").innerHTML+='<option value="'+w.id+'">'+esc(w.title)+'</option>';
    });
    students.forEach(function(s){
      $("srcStudent").innerHTML+='<option value="'+s.uid+'">'+esc(s.name||s.email)+'</option>';
    });
    var pre=new URLSearchParams(location.search).get("src");
    if(pre) $("srcWs").value=pre;
    fillMaps();
    $("srcWs").onchange=fillMaps;
  }).catch(handleErr("Could not load"));

  $("previewBtn").onclick=buildPreview;
});

function currentWs(){ return worksheets.filter(function(w){return w.id===$("srcWs").value;})[0]; }

function fillMaps(){
  var w=currentWs(); if(!w) return;
  var qs=(w.questions||[]);
  ["mapQ","mapA","mapB"].forEach(function(id,idx){
    var sel=$(id); sel.innerHTML="";
    qs.forEach(function(q,i){
      sel.innerHTML+='<option value="'+i+'">'+esc(q.label||("Question "+(i+1)))+' answer</option>';
    });
    sel.value=Math.min(idx,Math.max(0,qs.length-1));
  });
  $("newName").value=(w.title||"Worksheet")+" — Quiz";
}

function buildPreview(){
  var w=currentWs();
  if(!w){ showErr("Pick a source worksheet."); return; }
  var sf=$("srcStudent").value;
  var targets=students.filter(function(s){ return !sf||s.uid===sf; });
  var qi=Number($("mapQ").value), ai=Number($("mapA").value), bi=Number($("mapB").value);
  var every=$("everyAttempt").checked;

  $("previewArea").innerHTML='<p class="spinner">Gathering answers…</p>';

  Promise.all(targets.map(function(s){
    return studentsCol.doc(s.uid).collection("answers").doc(w.id).collection("attempts")
      .orderBy("createdAt","asc").get().then(function(snap){
        var out=[]; snap.forEach(function(d){ out.push(Object.assign({student:s},d.data())); });
        return every?out:out.slice(-1);
      }).catch(function(){return [];});
  })).then(function(lists){
    var atts=[].concat.apply([],lists);
    built=atts.map(function(a){
      var r=a.responses||{};
      return {
        from:(a.student.name||a.student.email)+" · "+(a.name||"Attempt"),
        text:stripHTML(r[qi]||""),
        a:stripHTML(r[ai]||""),
        b:stripHTML(r[bi]||""),
        correct:$("aCorrect").checked?0:-1,
        skip:false
      };
    }).filter(function(x){ return x.text||x.a||x.b; });
    renderPreview();
  });
}

function renderPreview(){
  var area=$("previewArea"); area.innerHTML="";
  if(!built.length){
    area.innerHTML='<div class="card"><p class="muted">No answers found for that worksheet yet.</p></div>';
    return;
  }
  var head=el("div","card");
  head.innerHTML='<h2>Preview &amp; fix — '+built.length+' question(s)</h2>'+
    '<p class="muted">Everything is editable. Fix spelling or skip weak ones before creating.</p>';
  area.appendChild(head);

  built.forEach(function(b,i){
    var c=el("div","card fill");
    if(b.skip) c.style.opacity="0.45";
    c.appendChild(el("p","muted","From: "+esc(b.from)));
    var qr=el("p"); qr.style.margin="4px 0";
    qr.appendChild(document.createTextNode("Q: "));
    var qi=document.createElement("input"); qi.type="text"; qi.value=b.text; qi.style.width="70%";
    qi.oninput=function(){ b.text=qi.value; };
    qr.appendChild(qi); c.appendChild(qr);

    ["a","b"].forEach(function(k,idx){
      var r=el("p"); r.style.margin="4px 0";
      r.appendChild(document.createTextNode(k+") "));
      var inp=document.createElement("input"); inp.type="text"; inp.value=b[k]; inp.style.width="220px";
      inp.oninput=function(){ b[k]=inp.value; };
      r.appendChild(inp);
      var lab=el("label","muted");
      var rad=document.createElement("input");
      rad.type="radio"; rad.name="c"+i; rad.style.width="auto"; rad.checked=b.correct===idx;
      rad.onchange=function(){ b.correct=idx; };
      lab.appendChild(rad); lab.appendChild(document.createTextNode(" correct"));
      r.appendChild(lab);
      c.appendChild(r);
    });

    c.appendChild(mkBtn(b.skip?"↺ include":"✕ skip","",function(){ b.skip=!b.skip; renderPreview(); }));
    area.appendChild(c);
  });

  var actions=el("div","card");
  var nameRow=el("p");
  nameRow.innerHTML='<strong>Create as:</strong> ';
  var mode=document.createElement("select"); mode.style.width="auto";
  mode.innerHTML='<option value="new">A new worksheet</option>'+
    worksheets.map(function(w){return '<option value="'+w.id+'">Add to: '+esc(w.title)+'</option>';}).join("");
  nameRow.appendChild(mode);
  actions.appendChild(nameRow);
  var msg=el("span","muted");
  actions.appendChild(mkBtn("Create","act",function(){ create(mode.value,msg); }));
  actions.appendChild(mkBtn("Cancel","",function(){ $("previewArea").innerHTML=""; }));
  actions.appendChild(msg);
  area.appendChild(actions);
}

function create(target,msg){
  var keep=built.filter(function(b){ return !b.skip && (b.text||b.a||b.b); });
  if(!keep.length){ showErr("Nothing to create — all skipped."); return; }
  var qs=keep.map(function(b,i){
    return { label:"", type:"mc", text:b.text,
      options:[b.a,b.b].filter(function(x){return x!=="";}),
      correct:b.correct };
  });
  if(target==="new"){
    var name=$("newName").value.trim()||"Generated worksheet";
    wsCol.add({title:name,tags:[],gold:0,questions:qs,slideshow:"",instructions:"",
      instructionEmbed:"",allowPhotos:false,order:worksheets.length,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(ref){ location.href="editor.html?id="+ref.id; })
      .catch(handleErr("Could not create"));
  } else {
    var w=worksheets.filter(function(x){return x.id===target;})[0];
    var merged=(w.questions||[]).concat(qs);
    wsCol.doc(target).set({questions:merged},{merge:true})
      .then(function(){ location.href="editor.html?id="+target; })
      .catch(handleErr("Could not add"));
  }
}
</script>
</body>
</html>
