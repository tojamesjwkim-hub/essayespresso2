<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EssayEspresso</title>
<link rel="stylesheet" href="style.css?v=3">
</head><body>
<div class="wrap narrow">
  <p class="muted" id="goingIn" style="margin-top:20px;">One moment…</p>
  <div id="msg"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="config.js?v=3"></script>
<script src="shared.js?v=3"></script>
<script>
/* There is no landing page any more. Everyone lands on the student dash;
   this file only exists so old links and the sign-out redirect still work. */
var sent=false;
function goTo(where){ if(sent) return; sent=true; location.replace(where); }
var fallback=setTimeout(function(){ LS.set("guest",true); goTo("student.html"); }, 1200);

auth.onAuthStateChanged(function(u){
  clearTimeout(fallback);
  if(!u){ LS.set("guest",true); goTo("student.html"); return; }
  resolveRole(u,function(role){
    if(role==="teacher"){ goTo("teacher.html"); return; }
    if(role==="parent"){ goTo("parent.html"); return; }
    /* student, pending and removed all land on the dash — it explains itself there */
    goTo("student.html");
  });
});
</script>
</body></html>
